name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build InspectorSwiftUI for iOS
        run: >
          xcodebuild
          -scheme InspectorSwiftUI
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
