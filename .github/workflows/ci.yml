name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Validate version
        run: ./Scripts/validate-version.sh
      - name: Test
        run: swift test
      - name: Test external package consumer
        run: ./Scripts/test-package-consumer.sh

  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build InspectorSwiftUI for iOS
        run: >
          xcodebuild
          -scheme InspectorSwiftUI
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
      - name: Build standalone example app
        working-directory: Examples/InspectorExample
        run: >
          xcodebuild
          -scheme InspectorExampleApp
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
